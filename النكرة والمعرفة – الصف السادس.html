<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>النكرة والمعرفة – الصف السادس الابتدائي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef6ee;--ink:#17352a;--card:#fff;--main:#1b7a55;--acc:#f2a900;--ok:#1e8e5a;--bad:#c9433b;--line:#cfe1d3;--hl:#fff0bd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1f18;--ink:#e6f2ea;--card:#17302480;--main:#5fcf9d;--line:#2c4a3b;--hl:#4a3d12;--ok:#4cc38a;--bad:#f0877f;--card:#173024}}
:root[data-theme="dark"]{--bg:#0e1f18;--ink:#e6f2ea;--card:#173024;--main:#5fcf9d;--line:#2c4a3b;--hl:#4a3d12;--ok:#4cc38a;--bad:#f0877f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.9 Cairo,Tahoma,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 14px 40px}
.top{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:15px;margin-top:4px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:10px}
h1{font-size:2.1rem;line-height:1.4;margin:.2em 0}h2{font-size:1.4rem;margin:.2em 0}
.big{font-size:1.5rem;font-weight:800;color:var(--main)}
.h{background:var(--hl);border-radius:6px;padding:0 6px;font-weight:600}
.lv{display:inline-block;font-size:14px;border:2px solid var(--main);color:var(--main);border-radius:20px;padding:0 12px;font-weight:600}
button{font:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--main);background:var(--card);color:var(--ink);padding:8px 16px;margin:5px 0;width:100%;text-align:right}
button:hover:not(:disabled){background:var(--hl)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.go{background:var(--main);color:#fff;text-align:center;font-weight:800;width:auto;min-width:160px;margin-top:14px}
:root:not([data-theme="light"]) .go{color:#0e1f18}
.go:hover{background:var(--main)!important;opacity:.9}
.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 18%,var(--card))!important}
.no{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 15%,var(--card))!important}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;border-right:6px solid var(--acc);background:var(--hl)}
table{width:100%;border-collapse:collapse;font-size:16px}td,th{border:2px solid var(--line);padding:6px 8px;text-align:right}th{background:var(--hl)}
.wrap{overflow-x:auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="top"><div class="bar"><i id="pb"></i></div><div class="meta"><span id="sec"></span><span id="st">⭐ 0</span></div></div>
<div id="app"></div>
</main>
<script>
const S=[];let i=0,stars=0,R=[];
const NM={n:'النكرة والمعرفة',l:'المعرفة بـ«أل»',a:'العلم',z:'الضمائر',i:'أسماء الإشارة',w:'الأسماء الموصولة',d:'المضاف إلى معرفة'};
const I=(sec,h)=>S.push({k:'i',sec,h});
const P=(sec,q,o,a,e,hint,lv,tag)=>S.push({k:'m',sec,q,o,a,e,hint,lv,tag});
const TF=['صح','خطأ'],NK=['نكرة','معرفة'];

S.push({k:'t'});
I('الأهداف',`<h2>ماذا سنتعلم اليوم؟</h2><p>① نفرّق بين <span class="h">النكرة</span> و<span class="h">المعرفة</span>.<br>② نعرف أثر «أل» على الاسم.<br>③ نتعرف أنواع المعرفة: العلم، والضمير، واسم الإشارة، والاسم الموصول، والمضاف إلى معرفة.<br>④ نصنّف الكلمات ونفسّر السبب ونصحّح الأخطاء.</p><p>في كل نقطة: <b>شرح ثم مثال ثم تدريب</b>، ولا ننتقل قبل أن تجيب إجابة صحيحة.</p>`);
I('تمهيد: ابحث عن الشيء المقصود',`<h2>ابحث عن الشيء المقصود</h2><p class="big">رأيتُ كتابًا.<br>رأيتُ الكتابَ.<br>رأيتُ كتابَ محمدٍ.<br>رأيتُ هذا الكتابَ.</p><p>فكّر ثم أجب.</p>`);
P('تمهيد','في الجملة الأولى، هل نعرف كتابًا محددًا؟',['نعم، نعرفه','لا، يمكن أن يكون أي كتاب'],1,'«كتابًا» غير محدد، فهو أي كتاب.','هل قلنا أي كتاب بالتحديد؟');
P('تمهيد','ما الفرق بين «كتابًا» و«الكتابَ»؟',['لا فرق','«الكتابَ» يدل على كتاب معين معروف بيننا','«كتابًا» أكثر تحديدًا'],1,'دخول «أل» جعل المقصود معينًا.','انظر إلى الكلمة الزائدة.');
P('تمهيد','لماذا أصبح المقصود أدق في الجملتين الثالثة والرابعة؟',['لأننا أضفنا إلى «محمد» وأشرنا بـ«هذا»','لأن الجملة أصبحت أقصر','لا سبب'],0,'الإضافة إلى معرفة واسم الإشارة يحدّدان الكتاب. وهذا ما ندرسه: النكرة والمعرفة.','ماذا جاء قبل «الكتاب» أو بعده؟');

I('١) ما النكرة؟',`<h2>النقطة الأولى: النكرة</h2><p>النكرة <span class="h">اسم يدل على شيء غير معين</span>: كتاب، طالب، شجرة، مدينة.</p><p>مثال: <b>حضرَ طالبٌ.</b> «طالبٌ» نكرة؛ لا نعرف أيّ طالب هو.</p><p>⚠️ النكرة ليست شيئًا مجهولًا تمامًا، بل لا تحدد فردًا بعينه في الجملة.</p>`);
P('النكرة','«اشتريتُ قلمًا». ما النكرة؟',['اشتريتُ','قلمًا','لا توجد'],1,'«قلمًا» اسم لا يدل على قلم معين.','ابحث عن الاسم غير المحدد.','سهل','n');
P('النكرة','«شاهدتُ عصفورًا»: «عصفورًا» يدل على عصفور معين. صح أم خطأ؟',TF,1,'خطأ؛ هو نكرة تدل على عصفور غير معين.','هل قلنا أي عصفور؟','متوسط','n');

I('٢) ما المعرفة؟',`<h2>النقطة الثانية: المعرفة</h2><p>المعرفة <span class="h">اسم يدل على معين</span>: محمد، هذا الطالب، الكتاب، أنا.</p><div class="wrap"><table><tr><th>نكرة</th><th>معرفة</th><th>السبب</th></tr><tr><td>طالبٌ</td><td>الطالبُ</td><td>دخلت «أل»</td></tr><tr><td>مدينةٌ</td><td>القاهرةُ</td><td>اسم علم</td></tr><tr><td>قلمٌ</td><td>هذا القلمُ</td><td>اسم إشارة</td></tr></table></div>`);
P('المعرفة','🎮 اكتشف الاسم المحدد: أيها معرفة؟',['شجرةٌ','القاهرةُ','مدينةٌ'],1,'«القاهرةُ» علم يدل على مدينة معينة.','أيها اسم مدينة معينة؟','سهل','n');
P('المعرفة','«هذا القلمُ» معرفة. صح أم خطأ؟',TF,0,'صح؛ اسم الإشارة وأل حدّدا القلم.','هل القلم محدد؟','متوسط','n');

I('٣) المعرفة بـ«أل»',`<h2>النقطة الثالثة: «أل»</h2><p>إذا دخلت «أل» على النكرة صارت معرفة:<br>كتابٌ ← <b>الكتابُ</b> | مدرسةٌ ← <b>المدرسةُ</b> | شجرةٌ ← <b>الشجرةُ</b></p><p>⚠️ عند دخول «أل» يسقط التنوين، فلا نقول «الكتابٌ».</p>`);
P('أل','حوّل «مدرسةٌ» إلى معرفة بـ«أل»:',['مدرسةُ','المدرسةُ','المدرسةٌ'],1,'نضيف «أل» ونحذف التنوين.','لا يجتمع التنوين مع «أل».','سهل','l');
P('أل','🔎 اكتشف الخطأ: أي جملة صحيحة؟',['رأيتُ الكتابًا','رأيتُ الكتابَ','رأيتُ الكتابٌ'],1,'«الكتابَ» بلا تنوين.','انظر إلى آخر الكلمة.','متقدم','l');

I('٤) العلم',`<h2>النقطة الرابعة: العلم</h2><p>العلم اسم يدل على شخص أو مكان أو شيء معين باسمه: محمد، مريم، مصر، الإسكندرية، النيل.</p><p>ولدٌ ← <b>أحمدُ</b> | مدينةٌ ← <b>القاهرةُ</b> | نهرٌ ← <b>النيلُ</b></p><p>⚠️ بعض الأعلام فيها «أل» مثل النيل، لكنها معرفة لأنها أعلام، لا لوجود «أل» فقط.</p>`);
P('العلم','🎮 من أنا؟ «أنا اسم يدل على شخص معين باسمه».',['علم','نكرة','ضمير'],0,'هذا تعريف العلم.','هل له اسم خاص؟','سهل','a');
P('العلم','«الإسكندريةُ» علم. صح أم خطأ؟',TF,0,'صح؛ اسم مدينة معينة.','هل هي مدينة معينة؟','متوسط','a');

I('٥) الضمائر',`<h2>النقطة الخامسة: الضمائر</h2><p>الضمير اسم يدل على المتكلم أو المخاطب أو الغائب، وهو معرفة.</p><p><b>المتكلم:</b> أنا، نحن &nbsp; <b>المخاطب:</b> أنتَ &nbsp; <b>الغائب:</b> هو، هي، هم</p><p><b>منفصل:</b> أنا أحب القراءة.<br><b>متصل:</b> كتابي جديد، ساعدتُه، قلمُك جميل (الياء والهاء والكاف).</p>`);
P('الضمائر','«أنا أحب القراءة». ما الضمير؟',['أنا','أحب','القراءة'],0,'«أنا» ضمير متكلم منفصل.','من المتكلم؟','سهل','z');
P('الضمائر','«كتابي جديد». ما الضمير المتصل؟',['كتابي','الياء في آخر كتابي','جديد'],1,'الياء ضمير متكلم متصل.','ما الحرف المتصل بآخر الكلمة؟','متوسط','z');

I('٦) أسماء الإشارة',`<h2>النقطة السادسة: أسماء الإشارة</h2><div class="wrap"><table><tr><th></th><th>مذكر</th><th>مؤنث</th></tr><tr><td>مفرد قريب</td><td>هذا</td><td>هذه</td></tr><tr><td>مثنى</td><td>هذان</td><td>هاتان</td></tr><tr><td>جمع</td><td colspan="2">هؤلاء</td></tr><tr><td>بعيد</td><td>ذلك</td><td>تلك</td></tr></table></div><p>مثال: هذه زهرةٌ جميلةٌ ← المشار إليه: الزهرة.</p>`);
P('الإشارة','اختر المناسب: «____ تلميذانِ»',['هذا','هذان','هؤلاء'],1,'«تلميذانِ» مثنى مذكر.','المثنى المذكر له شكل خاص.','سهل','i');
P('الإشارة','«____ زهرةٌ جميلةٌ»',['هذا','هذه','هؤلاء'],1,'«زهرةٌ» مفرد مؤنث.','مفرد أم جمع؟ مذكر أم مؤنث؟','متوسط','i');

I('٧) الأسماء الموصولة',`<h2>النقطة السابعة: الاسم الموصول</h2><p>الاسم الموصول يحتاج إلى جملة بعده توضح المقصود به، تسمى <span class="h">صلة الموصول</span>.</p><p>المفرد: <b>الذي</b> (مذكر)، <b>التي</b> (مؤنث).<br>المثنى: <b>اللذان</b> (مذكر)، <b>اللتان</b> (مؤنث).<br>الجمع: <b>الذين</b> (مذكر).</p><p>جاء الطالبُ <span class="h">الذي</span> فازَ.</p>`);
P('الموصول','«جاء الطالبُ ____ فازَ»',['التي','الذي','الذين'],1,'«الطالبُ» مفرد مذكر، فنقول «الذي».','أيها يناسب المفرد المذكر؟','سهل','w');
P('الموصول','«أحب الطلابَ الذين يساعدون غيرهم». ما صلة الموصول؟',['أحب','الطلابَ','يساعدون غيرهم'],2,'الجملة بعد «الذين» هي الصلة.','ما الجملة التي توضح الذين؟','متوسط','w');

I('٨) المضاف إلى معرفة',`<h2>النقطة الثامنة: الإضافة</h2><p><span class="h">كتابُ</span> الطالبِ: «كتابُ» مضاف، و«الطالبِ» مضاف إليه مجرور.</p><p>كتابٌ (نكرة) / الكتابُ (معرفة) / كتابُ محمدٍ (معرفة)</p><p>المضاف إلى معرفة يصير معرفة. أما المضاف إلى نكرة فيبقى نكرة: <b>كتابُ طالبٍ</b>.</p>`);
P('الإضافة','«بابُ المدرسةِ». ما المضاف؟',['بابُ','المدرسةِ','لا يوجد'],0,'«بابُ» مضاف، و«المدرسةِ» مضاف إليه.','المضاف هو الاسم الأول.','سهل','d');
P('الإضافة','«كتابُ طالبٍ»: نوع «كتابُ»؟',NK,0,'أُضيف إلى نكرة، فبقي نكرة.','«طالبٍ» نكرة أم معرفة؟','متقدم','d');

I('٩) المراجعة',`<h2>أنواع المعرفة</h2><div class="wrap"><table><tr><th>النوع</th><th>مثال</th><th>خطأ شائع</th></tr><tr><td>الضمير</td><td>أنا، هو</td><td>نسيان الضمير المتصل</td></tr><tr><td>العلم</td><td>مصر</td><td>ظن أن «أل» وحدها تكفي</td></tr><tr><td>اسم الإشارة</td><td>هذه</td><td>خطأ في المذكر والمؤنث</td></tr><tr><td>الاسم الموصول</td><td>الذي</td><td>نسيان صلة الموصول</td></tr><tr><td>المعرّف بـ«أل»</td><td>الكتاب</td><td>«أل» مع التنوين</td></tr><tr><td>المضاف إلى معرفة</td><td>قلمُ المعلمِ</td><td>الإضافة إلى نكرة</td></tr></table></div>`);
P('مراجعة','«الذي» نوعه:',['ضمير','اسم موصول','علم'],1,'«الذي» اسم موصول.','يحتاج جملة بعده.','متوسط','w');
P('مراجعة','«قلمُ المعلمِ» معرفة بسبب:',['الإضافة إلى معرفة','أنه علم','أنه ضمير'],0,'«المعلمِ» معرفة، فاكتسب المضاف التعريف.','ما الاسم الذي بعد «قلمُ»؟','متقدم','d');

I('ألعاب',`<h2>ألعاب سريعة</h2><p>🎮 صنّف الكلمات، وأكمل الجملة، واكتشف الخطأ.</p>`);
P('لعبة: صنّف','«طالبٌ»',NK,0,'نكرة.','هل هو محدد؟','سهل','n');
P('لعبة: صنّف','«هو»',NK,1,'ضمير، والضمير معرفة.','','سهل','z');
P('لعبة: أكمل','«قرأتُ كتابَ ____»',['محمدٍ','محمدٌ','محمدًا'],0,'المضاف إليه مجرور.','','متوسط','d');
P('لعبة: اكتشف الخطأ','«هذه الولدُ مجتهدٌ». الصواب:',['هذا الولدُ مجتهدٌ','هؤلاء الولدُ مجتهدٌ','لا خطأ'],0,'«الولدُ» مذكر، فنقول «هذا».','','متقدم','i');

I('الاختبار النهائي',`<h2>الاختبار النهائي</h2><p>٢٠ سؤالًا: ٨ اختيار من متعدد، ٤ صح أو خطأ، ٤ تصنيف، ٢ إكمال، ٢ تصحيح. تظهر النتيجة في النهاية.</p>`);
const Q=(tag,q,o,a,e)=>S.push({k:'m',sec:'الاختبار',q,o,a,e,hint:'',lv:'',tag,f:1});
Q('n','أي كلمة نكرة؟',['الطالبُ','طالبٌ','أنا'],1,'«طالبٌ» غير معين.');
Q('d','أي تركيب معرفة؟',['كتابٌ','كتابُ محمدٍ','مدينةٌ'],1,'مضاف إلى علم.');
Q('z','«هم يشاركون في النشاط». ما الضمير؟',['هم','يشاركون','النشاط'],0,'ضمير غائب.');
Q('i','اسم الإشارة للمفرد المؤنث:',['هذا','هذه','هؤلاء'],1,'«هذه».');
Q('w','الاسم الموصول للمثنى المذكر:',['الذي','اللذان','الذين'],1,'«اللذان».');
Q('d','«قلمُ المعلمِ»: المضاف إليه:',['قلمُ','المعلمِ','لا يوجد'],1,'«المعلمِ» جاء بعد المضاف.');
Q('a','أي كلمة علم؟',['مدينةٌ','هذه','القاهرةُ'],2,'اسم مدينة معينة.');
Q('l','أثر «أل» على «شجرةٌ»:',['تبقى نكرة','تصبح الشجرةُ معرفة','تصبح ضميرًا'],1,'«أل» تعرّف النكرة.');
Q('w','«الذي» اسم موصول.',TF,0,'صح.');
Q('d','«كتابُ طالبٍ» معرفة.',TF,1,'خطأ؛ أُضيف إلى نكرة.');
Q('z','«هو» ضمير غائب.',TF,0,'صح.');
Q('a','«أحمدُ» نكرة.',TF,1,'خطأ؛ علم فهو معرفة.');
Q('i','صنّف «هذا»:',NK,1,'اسم إشارة.');
Q('n','صنّف «عصفورٌ»:',NK,0,'نكرة.');
Q('w','صنّف «التي»:',NK,1,'اسم موصول.');
Q('d','صنّف «حقيبةُ محمدٍ»:',NK,1,'مضاف إلى علم.');
Q('i','أكمل: «____ طالبٌ مجتهدٌ»',['هذا','هذه','هؤلاء'],0,'«طالبٌ» مفرد مذكر.');
Q('d','أكمل: «قرأتُ كتابَ ____»',['محمدًا','محمدٍ','محمدٌ'],1,'المضاف إليه مجرور.');
Q('l','صحّح: «رأيتُ الكتابًا»',['رأيتُ الكتابَ','رأيتُ كتابَا','لا خطأ'],0,'لا تنوين مع «أل».');
Q('i','صحّح: «هذه تلميذانِ»',['هؤلاء تلميذانِ','هذان تلميذانِ','هذا تلميذانِ'],1,'المثنى المذكر: هذان.');
S.push({k:'r'},{k:'e'});

const $=id=>document.getElementById(id),app=$('app');
function star(n){stars+=n;$('st').textContent='⭐ '+stars}
function next(){i++;show()}
function show(){
  const s=S[i];$('pb').style.width=(i/(S.length-1)*100)+'%';$('sec').textContent=s.sec||'';
  window.scrollTo(0,0);
  if(s.k=='t')app.innerHTML=`<div class="card"><h1>🔎 النكرة والمعرفة</h1><p class="big">الصف السادس الابتدائي – اللغة العربية</p><p>درس تفاعلي: اكتشف، أجب، واجمع النجوم.</p><button class="go" onclick="next()">هيا نبدأ</button></div>`;
  else if(s.k=='i')app.innerHTML=`<div class="card">${s.h}<button class="go" onclick="next()">التالي</button></div>`;
  else if(s.k=='m')mcq(s);
  else if(s.k=='r')results();
  else app.innerHTML=`<div class="card"><h1>🎉 أحسنت!</h1><p class="big">جمعت ${stars} نجمة.</p><p>راجع الجدول كلما احتجت، وواصل التعلم.</p><button class="go" onclick="location.reload()">ابدأ من جديد</button></div>`;
}
function mcq(s){
  let done=false,tries=0;
  app.innerHTML=`<div class="card">${s.lv?`<span class="lv">${s.lv}</span>`:''}<h2>${s.q}</h2><div id="o"></div><div id="fb"></div></div>`;
  s.o.forEach((t,n)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{
    if(done)return;
    if(s.f){done=true;R.push({s,ok:n==s.a});[...$('o').children].forEach(x=>x.disabled=true);b.classList.add('ok');
      $('fb').innerHTML=`<div class="fb">تم تسجيل إجابتك.</div><button class="go" onclick="next()">التالي</button>`;if(n==s.a)star(1);return}
    if(n==s.a){done=true;b.classList.add('ok');star(tries?1:2);$('fb').innerHTML=`<div class="fb">✅ صحيح! ${s.e}</div><button class="go" onclick="next()">التالي</button>`}
    else{tries++;b.classList.add('no');b.disabled=true;$('fb').innerHTML=tries>1?`<div class="fb">❌ الحل: ${s.o[s.a]}. ${s.e}</div>`:`<div class="fb">❌ حاول مرة أخرى. تلميح: ${s.hint||'أعد قراءة الشرح.'}</div>`;if(tries>1){done=true;[...$('o').children][s.a].classList.add('ok');$('fb').innerHTML+=`<button class="go" onclick="next()">التالي</button>`}}
  };$('o').appendChild(b)});
}
function results(){
  const ok=R.filter(r=>r.ok).length,n=R.length,p=Math.round(ok/n*100),bad=R.filter(r=>!r.ok);
  const wk={},all={};R.forEach(r=>{all[r.s.tag]=1;if(!r.ok)wk[r.s.tag]=1});
  const strong=Object.keys(all).filter(t=>!wk[t]).map(t=>NM[t]);
  app.innerHTML=`<div class="card"><h1>النتيجة: ${ok} من ${n}</h1><p class="big">${p}% ${p>=85?'🌟 ممتاز':p>=60?'👍 جيد':'💪 تحتاج إلى مراجعة'}</p>
  ${strong.length?`<p>نقاط القوة: ${strong.join('، ')}.</p>`:''}
  ${bad.length?`<h2>شرح الأخطاء</h2>`+bad.map(r=>`<div class="fb"><b>${r.s.q}</b><br>الصواب: ${r.s.o[r.s.a]}<br>${r.s.e}</div>`).join(''):'<p>كل إجاباتك صحيحة!</p>'}
  <h2>التدريب العلاجي</h2><p>${Object.keys(wk).length?'راجع: '+Object.keys(wk).map(t=>NM[t]).join('، ')+'، ثم اكتب في كراستك جملتين على كل نقطة.':'اكتب في كراستك جملة لكل نوع من أنواع المعرفة.'}</p>
  <button class="go" onclick="next()">التالي</button></div>`;
}
show();
</script>
</body>
